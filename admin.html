<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRM | Vale do Aço Invest</title><style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#f5f0e6;font:15px system-ui,Arial}main{max-width:1250px;margin:auto;padding:25px 16px}h1{color:#ddb263;margin-bottom:3px}section{background:#232323;border:1px solid #373737;border-radius:12px;padding:20px;margin:18px 0}input,select,textarea,button{font:inherit;border-radius:7px;padding:10px;border:1px solid #666}input,select,textarea{background:#171717;color:#fff;max-width:100%}button{background:#ddb263;color:#171717;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.45;cursor:default}label{display:block;margin:8px 0}a{color:#efc778}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #444;text-align:left;vertical-align:top}th{color:#e8bc71}td select{min-width:135px}.wrap{overflow:auto}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.tools label{flex:1;min-width:170px}.tools input,.tools select{width:100%}.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px}#notice{min-height:24px;color:#f4ca82}small{color:#bfb7a8}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px}.modal[hidden], [hidden]{display:none!important}.dialog{width:min(620px,100%);background:#292929;border:1px solid #d2a958;padding:20px;border-radius:12px}.dialog textarea{width:100%;min-height:160px;resize:vertical}.name{font-weight:700} .hint{color:#bdb4a4}
</style></head><body><main><h1>Vale do Aço Invest</h1><p>CRM comercial · Painel privado</p>
<section id="login"><h2>Entrar</h2><form id="form"><label>E-mail<br><input id="email" type="email" autocomplete="username" required></label><label>Senha<br><input id="password" type="password" autocomplete="current-password" required></label><button>Entrar no CRM</button></form></section>
<section id="dashboard" hidden><div class="buttons"><button id="logout">Sair</button><button id="refresh">Atualizar</button></div><h2>Clientes e oportunidades</h2>
<div class="tools"><label>Pesquisar nome ou telefone<input id="search" placeholder="Digite para pesquisar"></label><label>Status<select id="statusFilter"><option value="">Todos os status</option><option value="novo">Novo</option><option value="contatado">Em atendimento</option><option value="qualificado">Negociação</option><option value="convertido">Convertido</option><option value="descartado">Perdido</option></select></label><label>Modalidade<select id="modalityFilter"><option value="">Todas</option><option value="imovel">Imóvel</option><option value="veiculo">Veículo</option><option value="carta">Carta</option><option value="outros">Outros</option></select></label><button id="apply">Pesquisar / Filtrar</button><button id="clear">Limpar filtros</button></div>
<p id="count"></p><div class="wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>WhatsApp</th><th>Modalidade</th><th>Crédito</th><th>Mensagem</th><th>Etapa</th><th>Observações</th></tr></thead><tbody id="rows"></tbody></table></div><div class="buttons"><button id="previous" disabled>Anterior</button><span id="page">Página 1</span><button id="next" disabled>Próxima</button></div><small>50 clientes por página. Alterações são salvas no Supabase.</small></section><p id="notice" role="status"></p></main>
<div id="editor" class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="editTitle"><h2 id="editTitle">Observações do cliente</h2><p id="editName"></p><label for="notes">Informações do atendimento</label><textarea id="notes" maxlength="3000" placeholder="Ex.: Cliente interessado em carta de R$ 200 mil; retornar sexta-feira."></textarea><div class="buttons"><button id="saveNotes">Salvar observações</button><button id="cancelNotes" type="button">Cancelar</button></div></div></div>
<script>
let token=null,page=1,editing=null;const el=id=>document.getElementById(id);const note=s=>el('notice').textContent=s;
const statuses={novo:'Novo',contatado:'Em atendimento',qualificado:'Negociação',convertido:'Convertido',descartado:'Perdido'};
const modalities={imovel:'Imóvel',veiculo:'Veículo',carta:'Carta',outros:'Outros'};
async function api(path,options={}){const res=await fetch('/api/admin/'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Erro HTTP '+res.status);return data}
function cell(tr,value){const td=document.createElement('td');td.textContent=value==null?'':String(value);tr.append(td);return td}
async function load(){const p=new URLSearchParams({page:String(page),search:el('search').value.trim(),status:el('statusFilter').value,modalidade:el('modalityFilter').value});const d=await api('leads?'+p);el('count').textContent=d.leads.length+' cliente(s) nesta página';el('page').textContent='Página '+page;el('previous').disabled=page===1;el('next').disabled=!d.has_more;const tbody=el('rows');tbody.replaceChildren();for(const lead of d.leads){const tr=document.createElement('tr');cell(tr,new Date(lead.created_at).toLocaleString('pt-BR'));cell(tr,lead.nome).className='name';const phone=cell(tr,'');const a=document.createElement('a');a.href='https://wa.me/'+(String(lead.telefone).replace(/\D/g,'').startsWith('55')?'':'55')+String(lead.telefone).replace(/\D/g,'');a.target='_blank';a.rel='noopener noreferrer';a.textContent=lead.telefone;phone.append(a);cell(tr,modalities[lead.modalidade]||lead.modalidade);cell(tr,lead.faixa_credito);cell(tr,lead.mensagem);const statusCell=cell(tr,'');const select=document.createElement('select');for(const [value,label] of Object.entries(statuses)){const opt=document.createElement('option');opt.value=value;opt.textContent=label;select.append(opt)}select.value=lead.status;select.onchange=async()=>{const previous=lead.status;select.disabled=true;try{await api('lead',{method:'PATCH',body:JSON.stringify({id:lead.id,status:select.value})});lead.status=select.value;note('Status de '+lead.nome+' atualizado.')}catch(e){select.value=previous;note(e.message)}finally{select.disabled=false}};statusCell.append(select);const noteCell=cell(tr,'');const btn=document.createElement('button');btn.textContent=lead.observacoes?'Editar notas':'Adicionar nota';btn.onclick=()=>{editing=lead;el('editName').textContent=lead.nome;el('notes').value=lead.observacoes||'';el('editor').hidden=false;el('notes').focus()};noteCell.append(btn);tbody.append(tr)}}
el('form').onsubmit=async e=>{e.preventDefault();note('Autenticando...');try{const d=await api('login',{method:'POST',body:JSON.stringify({email:el('email').value,password:el('password').value})});token=d.access_token;el('password').value='';await load();el('login').hidden=true;el('dashboard').hidden=false;note('CRM carregado.')}catch(e){token=null;note(e.message)}};
el('apply').onclick=()=>{page=1;load().catch(e=>note(e.message))};el('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el('apply').click()}};el('clear').onclick=()=>{el('search').value='';el('statusFilter').value='';el('modalityFilter').value='';page=1;load().catch(e=>note(e.message))};
el('refresh').onclick=()=>load().then(()=>note('Lista atualizada.')).catch(e=>note(e.message));el('previous').onclick=()=>{if(page>1){page--;load().catch(e=>note(e.message))}};el('next').onclick=()=>{page++;load().catch(e=>{page--;note(e.message)})};
el('logout').onclick=()=>{token=null;el('dashboard').hidden=true;el('login').hidden=false;note('Sessão encerrada.')};
el('cancelNotes').onclick=()=>{el('editor').hidden=true;editing=null};
el('saveNotes').onclick=async()=>{if(!editing)return;const btn=el('saveNotes');btn.disabled=true;try{const notes=el('notes').value;await api('lead',{method:'PATCH',body:JSON.stringify({id:editing.id,observacoes:notes})});editing.observacoes=notes;el('editor').hidden=true;editing=null;note('Observações salvas com sucesso.');await load()}catch(e){note(e.message)}finally{btn.disabled=false}};
</script></body></html>
