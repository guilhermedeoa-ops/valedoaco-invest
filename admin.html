<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de leads | Vale do Aço Invest</title><style>body{font:16px system-ui;background:#121212;color:#f5f0e6;margin:0}main{max-width:1080px;margin:auto;padding:32px 20px}h1{color:#ddb263}section{background:#242424;border-radius:12px;padding:22px;margin:18px 0}input,button,select{font:inherit;padding:12px;border-radius:7px;border:1px solid #666}input{background:#fff;color:#111;max-width:100%;box-sizing:border-box}button{background:#ddb263;color:#171717;cursor:pointer;border:0}button:disabled{opacity:.5}label{display:block;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #444;text-align:left;vertical-align:top}a{color:#f2c36f}#notice{min-height:24px} .wrap{overflow-x:auto}small{color:#c7c1b6}</style></head><body><main><h1>Vale do Aço Invest</h1><p>Painel privado de atendimento</p><section id="login"><h2>Entrar</h2><form id="form"><label>E-mail<br><input type="email" id="email" autocomplete="username" required></label><label>Senha<br><input type="password" id="password" autocomplete="current-password" required></label><button>Entrar no painel</button></form></section><section id="dashboard" hidden><button id="logout">Sair</button> <button id="refresh">Atualizar contatos</button><h2>Leads recebidos</h2><p id="count"></p><div class="wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>WhatsApp</th><th>Modalidade</th><th>Crédito</th><th>Mensagem</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><div style="display:flex;gap:12px;align-items:center;margin-top:16px"><button id="previous" disabled>Página anterior</button><span id="page">Página 1</span><button id="next" disabled>Próxima página</button></div><small>50 contatos por página, com acesso ao histórico.</small></section><p id="notice" role="status"></p></main><script>
let token=null,page=1;const el=id=>document.getElementById(id);const note=s=>el('notice').textContent=s;
async function api(path,options={}){const res=await fetch('/api/admin/'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Erro HTTP '+res.status);return data}
el('form').onsubmit=async e=>{e.preventDefault();note('Autenticando...');try{const d=await api('login',{method:'POST',body:JSON.stringify({email:el('email').value,password:el('password').value})});token=d.access_token;el('password').value='';await load();el('login').hidden=true;el('dashboard').hidden=false;note('Acesso autorizado.')}catch(err){token=null;note(err.message)}};
async function load(){const d=await api('leads?page='+page);el('count').textContent=d.leads.length+' contato(s) nesta página';el('page').textContent='Página '+page;el('previous').disabled=page===1;el('next').disabled=!d.has_more;const body=el('rows');body.replaceChildren();for(const lead of d.leads){const tr=document.createElement('tr');const vals=[new Date(lead.created_at).toLocaleString('pt-BR'),lead.nome,lead.telefone,lead.modalidade,lead.faixa_credito||'',lead.mensagem||'',lead.status];vals.forEach((v,i)=>{const td=document.createElement('td');if(i===2){const a=document.createElement('a');a.href='https://wa.me/55'+String(v).replace(/\D/g,'');a.target='_blank';a.rel='noopener noreferrer';a.textContent=v;td.append(a)}else td.textContent=v;tr.append(td)});body.append(tr)}}
el('previous').onclick=()=>{if(page>1){page--;load().catch(e=>note(e.message))}};el('next').onclick=()=>{page++;load().catch(e=>{page--;note(e.message)})};el('refresh').onclick=()=>load().then(()=>note('Lista atualizada.')).catch(e=>note(e.message));el('logout').onclick=()=>{token=null;el('dashboard').hidden=true;el('login').hidden=false;note('Sessão encerrada.')};
</script></body></html>
